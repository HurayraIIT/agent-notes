# Shared by both listeners in nginx.conf. Every path goes to the front controller; there are no static files.
location / {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /app/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTPS $agent_notes_https;
    fastcgi_param AGENT_NOTES_SCOPE $agent_notes_scope;
    fastcgi_pass agent_notes_php;
    fastcgi_read_timeout 120s;
}
