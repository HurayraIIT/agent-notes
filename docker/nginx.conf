# Two listeners, one per scope. The scope reaches PHP as the FastCGI parameter AGENT_NOTES_SCOPE,
# which only this file sets: request headers arrive in PHP as HTTP_* and cannot collide with it
# (src/features.php request_scope(), tests/scope.php).
#   8080  public scope  — the only port the public reverse proxy may reach
#   8081  tailnet scope — the full app; publish it on a loopback or tailnet address only, never 0.0.0.0
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    server_tokens off;
    client_max_body_size 16m;          # upload_asset bodies; keep in step with docker/php.ini post_max_size
    client_body_temp_path /tmp/client_body;
    fastcgi_temp_path /tmp/fastcgi;

    # Client address for rate limits. Both proxies in front (the public front door and the tailnet
    # server block) overwrite X-Forwarded-For with the address they saw, and only they can reach
    # these ports, so the header is trusted from private ranges only.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;

    map $http_x_forwarded_proto $agent_notes_https {
        https on;
        default '';
    }

    upstream agent_notes_php {
        server app:9000;
    }

    server {
        listen 8080;
        set $agent_notes_scope public;
        include /etc/nginx/agent-notes-app.conf;
    }

    server {
        listen 8081;
        set $agent_notes_scope tailnet;
        include /etc/nginx/agent-notes-app.conf;
    }
}
